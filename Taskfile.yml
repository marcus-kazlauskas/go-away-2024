version: '3'

tasks:
  default:
    desc: "Full build: generate, lint, test, build"
    cmds:
      - task: build

  generate:
    desc: Regenerate code (oapi-codegen for internal/api)
    sources:
      - api/openapi-go-away-2024.yml
      - internal/api/*-codegen.yml
    generates:
      - internal/api/*.gen.go
    cmds:
      - go generate ./...

  lint:
    desc: Run golangci-lint
    deps: [generate]
    cmds:
      - golangci-lint run

  migrate:
    desc: Apply DB migrations (needs local Postgres)
    dir: db-migrations
    cmds:
      - goose up

  test:
    desc: Apply migrations and run all tests (needs local Postgres)
    deps: [generate, migrate]
    cmds:
      - go test ./...

  test:unit:
    desc: Run tests that need no infrastructure
    deps: [generate]
    cmds:
      - go test ./internal/puzzles/...

  run:
    desc: Apply migrations and start the app (needs local environment)
    deps: [generate, migrate]
    dir: cmd
    cmds:
      - go run main.go

  build:
    desc: Generate, lint, test and build
    cmds:
      - task: generate
      - task: lint
      - task: test
      - go build ./...
